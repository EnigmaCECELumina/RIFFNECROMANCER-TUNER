services:
  # 1. Node.js/Express Backend
  - type: web
    name: rune-ritual-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # 2. React/Next.js Frontend
  - type: web
    name: rune-ritual-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
